services:
  ui-workout:
    build:
      context: .
      dockerfile: Dockerfile
    image: ui-workout:local
    container_name: ui-workout
    restart: unless-stopped

    # Container-internal only: the shared reverse proxy reaches the app over
    # malakhovsu_web. Nothing is published to the host.
    expose:
      - "3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"

    networks:
      malakhovsu_web:
        aliases:
          - ui-workout

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # A static Next.js page server needs very little; these keep a runaway
    # process from starving the host.
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 96M
    mem_limit: 320M
    mem_reservation: 96M

    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Created and owned elsewhere, together with the shared reverse proxy.
  malakhovsu_web:
    external: true
